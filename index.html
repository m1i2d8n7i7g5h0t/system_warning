
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>System Warning</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: #08080d;
            color: white;
            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            z-index: -1;
        }

        .warning-box {
            width: 100%;
            max-width: 430px;
            padding: 35px 25px;

            text-align: center;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);

            border-radius: 22px;
            backdrop-filter: blur(18px);

            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);

            animation: appear 1s ease;
        }

        .warning-icon {
            font-size: 55px;
            margin-bottom: 20px;

            animation: pulse 2s infinite;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            color: #ff5555;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .description {
            font-size: 14px;
            line-height: 1.9;
            color: #dddddd;
            margin-bottom: 15px;
        }

        .question {
            font-size: 15px;
            font-weight: 600;
            margin: 25px 0;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;

            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 700;

            cursor: pointer;
            transition: 0.3s;
        }

        .accept {
            background: linear-gradient(135deg, #ff4141, #d90000);
            color: white;
            box-shadow: 0 5px 20px rgba(255, 0, 0, 0.25);
        }

        .decline {
            background: rgba(255, 255, 255, 0.12);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        button:hover {
            transform: translateY(-4px);
            filter: brightness(1.2);
        }

        .footer {
            font-size: 10px;
            color: #999;
            margin-top: 25px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(35px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.12);
            }
        }

        @media (max-width: 480px) {
            .warning-box {
                padding: 30px 20px;
            }

            h1 {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

    <video autoplay muted loop playsinline>
        <source src="video1.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div class="warning-box">

        <div class="warning-icon">⚠️</div>

        <h1>SECURITY WARNING</h1>

        <p class="description">
            This website may contain dangerous surprises,
            unexpected activities and unknown digital experiences.
        </p>

        <p class="description">
            We recommend proceeding only if you are willing
            to take the risk.
        </p>

        <p class="question">
            Do you want to continue?
        </p>

        <div class="buttons">

            <button class="accept" onclick="continueSite()">
                ACCEPT & CONTINUE
            </button>

            <button class="decline" onclick="continueSite()">
                DECLINE
            </button>

        </div>

        <div class="footer">
            SYSTEM NOTICE • PLEASE PROCEED
        </div>

    </div>

    <script>
        function continueSite() {
            window.location.href = "birthday.html";
        }
    </script>

</body>
</html>
